<h1>Gym Tracker</h1>

<label>Choose Workout Routine:</label>
<select>
  <option>Upper Body</option>
  <option>Lower Body</option>
  <option>Push Day</option>
  <option>Pull Day</option>
  <option>Leg Day</option>
</select>
<form>
  <label>Exercise Name:</label>
  <input type="text" placeholder="e.g., Bench Press">

  <label>Weight (kg):</label>
  <input type="number" placeholder="e.g., 60">

  <label>Reps:</label>
  <input type="number" placeholder="e.g., 8">

  <label>Sets:</label>
  <input type="number" placeholder="e.g., 3">

  <button type="submit">Log Exercise</button>
</form>
<div id="workout-log">
  <h2>Today's Session</h2>
  <ul id="log-list"></ul>
</div>
