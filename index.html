<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Gym Tracker</h1>
    
    <label for="workout-type">Choose Workout Routine:</label>
    <select id="workout-type">
      <option value="upper">Upper Body</option>
      <option value="lower">Lower Body</option>
      <option value="push">Push Day</option>
      <option value="pull">Pull Day</option>
      <option value="legs">Leg Day</option>
    </select>

    <form id="workout-form">
      <label for="exercise">Exercise Name:</label>
      <input type="text" id="exercise" placeholder="e.g., Bench Press" required>

      <label for="weight">Weight (kg):</label>
      <input type="number" id="weight" placeholder="e.g., 60" required>

      <label for="reps">Reps:</label>
      <input type="number" id="reps" placeholder="e.g., 8" required>

      <label for="sets">Sets:</label>
      <input type="number" id="sets" placeholder="e.g., 3" required>

      <button type="submit">Log Exercise</button>
    </form>

    <div id="workout-log">
      <h2>Today's Session</h2>
      <ul id="log-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
